name: Build Tunetrail

on:
  push:
    branches: ['**']
    tags: ['v*', 'beta-*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish as a named release with this tag (e.g. beta-1.0.0 → "Tunetrail Beta v1.0.0"); empty = dev build'
        required: false
        default: ''
      admin_build:
        description: 'Also build the admin (debug tools) Windows build — kept 1 day; only build it when you need it'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# A newer push to the same branch supersedes a build still in progress.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Core package tests
        working-directory: packages/tunetrail_core
        run: dart pub get && dart test
      - name: Server analysis
        working-directory: server
        run: dart pub get && dart analyze

  android:
    # Full builds only for releases (manual runs and version tags): pushes just
    # run the tests, to save Actions minutes.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Gradle dependencies, the wrapper and native (C++) plugin builds are
      # reused between runs; only what changed is rebuilt.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            build/app/intermediates
            build/*/intermediates
            build/*/.cxx
            build/*/kotlin
            build/*/tmp
          key: android-gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle.properties') }}-${{ github.run_id }}
          restore-keys: |
            android-gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle.properties') }}-
            android-gradle-${{ runner.os }}-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Set up release signing (if secrets are configured)
        env:
          KEYSTORE_B64: ${{ secrets.TUNETRAIL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf %s "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TUNETRAIL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured"
          else
            echo "::warning::TUNETRAIL_KEYSTORE_BASE64 secret not set - APKs will be signed with the debug key"
          fi
      - name: Build universal APK
        env:
          TUNETRAIL_KEYSTORE_PASSWORD: ${{ secrets.TUNETRAIL_KEYSTORE_PASSWORD }}
          TUNETRAIL_KEY_ALIAS: ${{ secrets.TUNETRAIL_KEY_ALIAS }}
          TUNETRAIL_KEY_PASSWORD: ${{ secrets.TUNETRAIL_KEY_PASSWORD }}
        # Retried: plugin build hooks download prebuilt libraries from
        # GitHub, which occasionally answers 502/504.
        run: |
          for i in 1 2 3; do
            flutter build apk --release --no-tree-shake-icons --dart-define=TUNETRAIL_SERVER=${{ vars.TUNETRAIL_SERVER }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }} --dart-define=GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID }} --dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ vars.GOOGLE_DESKTOP_CLIENT_ID }} --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }} --dart-define=LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }} --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }} --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }} --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID }} && exit 0
            echo "::warning::build attempt $i failed, retrying"; sleep 20
          done
          exit 1
      - name: Build per-ABI APKs (smaller downloads)
        env:
          TUNETRAIL_KEYSTORE_PASSWORD: ${{ secrets.TUNETRAIL_KEYSTORE_PASSWORD }}
          TUNETRAIL_KEY_ALIAS: ${{ secrets.TUNETRAIL_KEY_ALIAS }}
          TUNETRAIL_KEY_PASSWORD: ${{ secrets.TUNETRAIL_KEY_PASSWORD }}
        # Retried: plugin build hooks download prebuilt libraries from
        # GitHub, which occasionally answers 502/504.
        run: |
          for i in 1 2 3; do
            flutter build apk --release --split-per-abi --no-tree-shake-icons --dart-define=TUNETRAIL_SERVER=${{ vars.TUNETRAIL_SERVER }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }} --dart-define=GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID }} --dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ vars.GOOGLE_DESKTOP_CLIENT_ID }} --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }} --dart-define=LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }} --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }} --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }} --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID }} && exit 0
            echo "::warning::build attempt $i failed, retrying"; sleep 20
          done
          exit 1
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Tunetrail-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Tunetrail-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Tunetrail-android-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/Tunetrail-android-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tunetrail-android
          path: dist/*.apk
          retention-days: 1

  windows:
    # Full builds only for releases (manual runs and version tags): pushes just
    # run the tests, to save Actions minutes.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/cache@v4
        with:
          path: build/windows
          key: windows-build-${{ hashFiles('pubspec.lock', 'windows/**/CMakeLists.txt') }}-${{ github.run_id }}
          restore-keys: |
            windows-build-${{ hashFiles('pubspec.lock', 'windows/**/CMakeLists.txt') }}-
      - run: flutter build windows --release --no-tree-shake-icons --dart-define=TUNETRAIL_SERVER=${{ vars.TUNETRAIL_SERVER }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }} --dart-define=GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID }} --dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ vars.GOOGLE_DESKTOP_CLIENT_ID }} --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }} --dart-define=LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }} --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }} --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }} --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID }}
      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\Tunetrail-windows-x64.zip
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppSource="$PWD\build\windows\x64\runner\Release" /O"$PWD\dist" windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: tunetrail-windows
          path: dist/*
          retention-days: 1
      # Admin build: debug tools compiled in (they only unlock for accounts in
      # the server's ADMINS list). Kept as a workflow artifact for people with
      # repository access — never attached to a public release.
      - if: ${{ github.event.inputs.admin_build == 'true' }}
        run: flutter build windows --release --no-tree-shake-icons --dart-define=TUNETRAIL_ADMIN=true --dart-define=TUNETRAIL_SERVER=${{ vars.TUNETRAIL_SERVER }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }} --dart-define=GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID }} --dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ vars.GOOGLE_DESKTOP_CLIENT_ID }} --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }} --dart-define=LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }} --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }} --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }} --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID }}
      - name: Package admin build
        if: ${{ github.event.inputs.admin_build == 'true' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force admin | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath admin\Tunetrail-ADMIN-windows-x64.zip
      - if: ${{ github.event.inputs.admin_build == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: admin-windows
          path: admin/*
          retention-days: 1

  linux:
    # Full builds only for releases (manual runs and version tags): pushes just
    # run the tests, to save Actions minutes.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --no-tree-shake-icons --dart-define=TUNETRAIL_SERVER=${{ vars.TUNETRAIL_SERVER }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }} --dart-define=GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID }} --dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ vars.GOOGLE_DESKTOP_CLIENT_ID }} --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }} --dart-define=LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }} --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }} --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }} --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID }}
      - name: Package tarball
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf dist/Tunetrail-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: tunetrail-linux
          path: dist/*
          retention-days: 1

  server:
    # Full builds only for releases (manual runs and version tags): pushes just
    # run the tests, to save Actions minutes.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Checks the game server's Docker image builds (deploy/ uses it).
      - run: docker build -t tunetrail-server .

  release:
    needs: [test, android, windows, linux]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tunetrail-*
          merge-multiple: true
      - name: Release name
        id: rel
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          tag="${{ github.event.inputs.release_tag }}"
          if [[ -n "$tag" ]]; then ref="$tag"; fi
          if [[ -n "$tag" || "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=$ref" >> "$GITHUB_OUTPUT"
            if [[ "$ref" == beta-* ]]; then
              echo "name=Tunetrail Beta v${ref#beta-}" >> "$GITHUB_OUTPUT"; echo "pre=true" >> "$GITHUB_OUTPUT"
            elif [[ "$ref" == *-beta ]]; then
              echo "name=Tunetrail Beta ${ref%-beta}" >> "$GITHUB_OUTPUT"; echo "pre=true" >> "$GITHUB_OUTPUT"
            else
              echo "name=Tunetrail $ref" >> "$GITHUB_OUTPUT"; echo "pre=false" >> "$GITHUB_OUTPUT"
            fi
            echo "kind=Release" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=Tunetrail dev build ${{ github.run_number }}" >> "$GITHUB_OUTPUT"; echo "pre=true" >> "$GITHUB_OUTPUT"
            echo "kind=Developer build" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.rel.outputs.pre }}
          body: |
            ${{ steps.rel.outputs.kind }} of Tunetrail (`${{ steps.rel.outputs.tag }}`) from `${{ github.ref_name }}` @ ${{ github.sha }}.

            **Windows:** download `Tunetrail-windows-x64-setup.exe` (installer) or the portable `Tunetrail-windows-x64.zip` (extract, then run `Tunetrail.exe`).
            **Linux:** download `Tunetrail-linux-x64.tar.gz`, extract it and run `./tunetrail` (needs GTK 3 and ALSA or PulseAudio for sound).
            **Android:** download `Tunetrail-android-universal.apk` (or the smaller `arm64` APK for most modern phones) and allow installs from unknown sources.

            Questions about music rights: see Profile → Settings → Copyright & DMCA.
          files: dist/*
