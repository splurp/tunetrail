org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Faster CI and local builds: reuse task outputs and build modules in parallel.
org.gradle.caching=true
org.gradle.parallel=true
# Every APK (universal, arm64, arm32, x86_64) gets the same version code —
# pubspec.yaml's build number — so any download installs over any older
# one. (Flutter's default adds 1000/2000/4000 per architecture, which made
# a universal APK look like a downgrade from an arm64 one: "App not
# installed".)
force-version-code-ignoring-abi=true
